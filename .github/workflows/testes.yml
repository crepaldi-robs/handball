name: Testes

# Portao de qualidade. Roda a mesma verificacao obrigatoria do AGENTS.md em
# windows-latest, porque producao e Windows e os scripts de operacao sao
# PowerShell com CRLF. Repositorio publico: minutos de Actions sao ilimitados,
# entao nao ha motivo para trocar fidelidade por velocidade.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Conferir que o PowerShell 7 existe
        # Os testes de operacao se auto-pulam quando pwsh falta. Em CI queremos
        # que eles executem de verdade, entao falhamos cedo se sumir do runner.
        shell: pwsh
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            throw "pwsh ausente: os testes de operacao seriam silenciosamente pulados."
          }

      - name: Testes
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Compilacao
        run: python -m compileall -q app.py attendance handball tests
