<!doctype html>
<html lang="pt-BR" data-theme="{{ 'neutral' if team_theme.slug == 'neutral' else 'team' }}" data-team="{{ team_theme.slug }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="{{ team_theme.primary }}">
  <title>Minha confirmação · {{ organization.display_name }}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/tokens.generated.css">
  <link rel="stylesheet" href="/static/css/hm-ime-expressive.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/platform.js" defer></script>
  <script src="/static/player-attendance.js" defer></script>
</head>
<body class="platform-body" data-csrf-token="{{ session.csrf_token }}">
  <header class="topbar"><div class="topbar-inner">
    {% set page_subtitle = "Minha confirmação" %}
    {% include "partials/_brand.html" %}
    <div class="top-actions"><span class="user-label">{{ session.display_name }}</span><form method="post" action="/logout" data-platform-logout><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="text-button logout-button" type="submit">Sair</button></form></div>
  </div></header>
  <main class="module-shell player-attendance-shell">
    {% include "partials/_attendance_response_widget.html" %}
  </main>
  {% include "partials/_player_bottom_nav.html" %}
</body>
</html>
