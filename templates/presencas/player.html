<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1f33">
  <title>Minha confirmação · {{ organization.display_name }}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/platform.js" defer></script>
  <script src="/static/player-attendance.js" defer></script>
</head>
<body class="platform-body" data-csrf-token="{{ session.csrf_token }}">
  <header class="topbar"><div class="topbar-inner">
    <a class="identity" href="/app"><div class="mini-mark" aria-hidden="true">H</div><div><strong>{{ organization.display_name }}</strong><span>Minha confirmação</span></div></a>
    <div class="top-actions"><span class="user-label">{{ session.display_name }}</span><form method="post" action="/logout" data-platform-logout><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="text-button logout-button" type="submit">Sair</button></form></div>
  </div></header>
  <main class="module-shell player-attendance-shell">
    <section class="hub-intro"><span class="eyebrow">PRÓXIMO TREINO</span><h1>Minha presença</h1><p id="player-training-description">Carregando seu próximo treino…</p></section>
    <section id="player-attendance-alert" aria-live="polite"></section>
    <form id="player-attendance-form" class="panel stack-form hidden">
      <h2 id="player-training-title">Treino</h2>
      <fieldset><legend>Você vai ao treino?</legend><label><input type="radio" name="response" value="GOING" required> Vou</label><label><input type="radio" name="response" value="NOT_GOING"> Não vou</label></fieldset>
      <fieldset id="player-positions"><legend>Posições para este treino</legend><div id="player-position-options" class="inline-options"></div></fieldset>
      <label><span>Justificativa ou observação para a CT (opcional)</span><textarea id="player-justification" rows="4" maxlength="1000" placeholder="Ex.: vou chegar atrasado, consulta médica…"></textarea></label>
      <button class="button button-primary button-large" type="submit">Salvar minha resposta</button>
    </form>
  </main>
</body>
</html>
